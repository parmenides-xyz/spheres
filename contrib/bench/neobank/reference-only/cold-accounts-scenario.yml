version: 1

chains:
  sphere:
    network: tempo
    rpc_url: "${SPHERE_REDACTED_RPC_URL}"
    query_rpc_url: "${SPHERE_RPC_URL}"
    observation:
      mode: auto
      websocket_url: "${SPHERE_WS_RPC_URL}"
      poll_interval: 50ms
    request_auth:
      sender_header:
        name: X-Authorization-Token
        map: "${SPHERES_BENCH_SPHERE_AUTH_MAP}"
        reload_interval: 1s
    chain_id: ${SPHERES_BENCH_EXPECTED_SPHERE_CHAIN_ID}
    workload: ./sphere-flow.yml

# Sphere-only load on uncached L1 commitments: each instance is one sponsored
# transaction whose 32 calls each load a fresh account, with no L1 deposit or
# withdrawal, so the SpherePortal deposit limit never applies.
scenario:
  name: neobank-cold-accounts
  execution: dag
  timeout: 2m

  bindings:
    account:
      account: { pool: users, select: lease }

  steps:
    - id: cold_account_calls
      submit:
        chain: sphere
        template: cold_account_calls
        with:
          from: { var: account.ref }
        await: receipt
      save: cold_account_calls
