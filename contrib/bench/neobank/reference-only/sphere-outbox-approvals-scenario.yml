version: 1

chains:
  sphere:
    network: tempo
    rpc_url: "${SPHERE_REDACTED_RPC_URL}"
    query_rpc_url: "${SPHERE_RPC_URL}"
    observation:
      mode: auto
      websocket_url: "${SPHERE_WS_RPC_URL}"
      poll_interval: 50ms
    request_auth:
      sender_header:
        name: X-Authorization-Token
        map: "${SPHERES_BENCH_SPHERE_AUTH_MAP}"
        reload_interval: 1s
    chain_id: ${SPHERES_BENCH_EXPECTED_SPHERE_CHAIN_ID}
    workload: ./sphere-flow.yml

scenario:
  name: neobank-sphere-outbox-approvals
  execution: dag
  timeout: 2m

  bindings:
    account:
      account: { pool: users, select: lease }

  steps:
    - id: approve_base_token
      submit:
        chain: sphere
        template: approve_base_token
        with:
          from: { var: account.ref }
        await: receipt
      save: base_token_approval

    - id: approve_earn_token
      submit:
        chain: sphere
        template: approve_earn_token
        with:
          from: { var: account.ref }
        await: receipt
      save: earn_token_approval
