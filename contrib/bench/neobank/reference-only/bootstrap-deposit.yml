chain_id: ${SPHERES_BENCH_EXPECTED_L1_CHAIN_ID}

gas:
  max_fee_per_gas: ${SPHERES_BENCH_L1_MAX_FEE_PER_GAS}
  max_priority_fee_per_gas: ${SPHERES_BENCH_L1_MAX_PRIORITY_FEE_PER_GAS}

accounts:
  control:
    mnemonic: "${SPHERES_BENCH_MNEMONIC}"
    range: [${SPHERES_BENCH_CONTROL_ACCOUNT_INDEX}, ${SPHERES_BENCH_CONTROL_ACCOUNT_END}]

artifacts:
  ERC20: abis/erc20.json
  SpherePortal: abis/neobank-sphere-portal.json

templates:
  control_portal_approval:
    type: tempo
    gas_limit: ${SPHERES_BENCH_APPROVAL_GAS_LIMIT}
    fee_token: "${SPHERES_BENCH_TOKEN}"
    call:
      to: "${SPHERES_BENCH_TOKEN}"
      abi: ERC20
      function: "approve(address,uint256)"
      args:
        - "${L1_PORTAL_ADDRESS}"
        - "115792089237316195423570985008687907853269984665640564039457584007913129639935"

  bootstrap_deposit:
    type: tempo
    gas_limit: ${SPHERES_BENCH_DEPOSIT_GAS_LIMIT}
    fee_token: "${SPHERES_BENCH_TOKEN}"
    call:
      to: "${L1_PORTAL_ADDRESS}"
      abi: SpherePortal
      function: "deposit(address,uint128,uint256,(bytes32,uint8,bytes,bytes12,bytes16),address)"
      args:
        - "${SPHERES_BENCH_TOKEN}"
        - ${SPHERES_BENCH_BOOTSTRAP_DEPOSIT_AMOUNT}
        - { var: encryption.keyIndex }
        - { var: encryption.encrypted }
        - { var: account.address }

mix: []
