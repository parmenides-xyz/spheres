version: 1

include:
  - ./neobank-scenario-fragments.yml

chains:
  l1:
    network: sphere
    rpc_url: "${L1_RPC_URL}"
    query_rpc_url: "${SPHERES_BENCH_L1_QUERY_RPC_URL}"
    observation:
      mode: auto
      websocket_url: "${L1_WS_RPC_URL}"
      poll_interval: 50ms
    chain_id: ${SPHERES_BENCH_EXPECTED_L1_CHAIN_ID}
    workload: ./l1-onramp.yml

  sphere:
    network: sphere
    rpc_url: "${SPHERE_REDACTED_RPC_URL}"
    query_rpc_url: "${SPHERE_RPC_URL}"
    observation:
      mode: auto
      websocket_url: "${SPHERE_WS_RPC_URL}"
      poll_interval: 50ms
    request_auth:
      sender_header:
        name: X-Authorization-Token
        map: "${SPHERES_BENCH_SPHERE_AUTH_MAP}"
        reload_interval: 1s
    chain_id: ${SPHERES_BENCH_EXPECTED_SPHERE_CHAIN_ID}
    workload: ./sphere-flow.yml

scenario:
  name: neobank-encrypted-deposit
  execution: dag
  timeout: 10m

  bindings:
    account:
      account: { pool: users, select: lease }
    onramp_action_id:
      bytes32: { random_bytes: 32 }

  steps:
    - use: encrypted-sphere-entry
      as: onramp
      with:
        sender: { var: account.ref }
        sender_address: { var: account.address }
        recipient: { var: account.address }
        token: "${SPHERES_BENCH_TOKEN}"
        amount: ${SPHERES_BENCH_DEPOSIT_AMOUNT}
        memo: { var: onramp_action_id }
