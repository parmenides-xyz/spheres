[package]
name = "sphere-chainspec"
description = "Arc Sphere chain specification"
version = "0.5.0"
edition = "2024"
publish = false

[dependencies]
arc-execution-config.workspace = true
sphere-primitives = { path = "../primitives" }
reth-chainspec = { workspace = true, default-features = true }
reth-cli = { workspace = true, optional = true }
reth-network-peers = { workspace = true, default-features = true }
reth-primitives-traits.workspace = true
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
eyre = { workspace = true, optional = true }
serde_json = { workspace = true, default-features = true }
thiserror = { version = "2", default-features = false }

[features]
default = []
cli = ["dep:eyre", "dep:reth-cli"]
test-utils = ["reth-chainspec/test-utils"]
