[package]
name = "sphere-l1"
version = "0.5.0"
edition = "2024"
publish = false

[dependencies]
futures.workspace = true
thiserror.workspace = true
url = "2"
metrics.workspace = true
reth-metrics.workspace = true
alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["serde", "k256"] }
alloy-rpc-types-eth.workspace = true
eyre.workspace = true
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.44.2", default-features = false, features = ["sync", "rt-multi-thread", "macros", "time", "test-util"] }
alloy-sol-types = { version = "1.5.6", default-features = false }
sphere-contracts = { path = "../contracts", features = ["std", "serde", "rpc"] }
k256 = { version = "0.13.4", features = ["arithmetic", "ecdh"] }
tracing = "0.1"
derive_more = { version = "2.0.0", features = ["deref"] }
schnellru = "0.2"
sphere-precompiles = { path = "../precompiles", features = ["std"] }
sphere-primitives = { path = "../primitives" }
reth-primitives-traits = { workspace = true, features = ["serde"] }
rayon = "1"
alloy-network = { version = "2.0.4", default-features = false }
alloy-provider = { version = "2.0.4", features = ["ws"] }

reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
alloy-rpc-client = { version = "2.0.4", features = ["ws"] }
alloy-transport = { version = "2.0.4", default-features = false }

[dev-dependencies]
reth-provider = { workspace = true, features = ["test-utils"] }
const-hex.workspace = true
serde_json.workspace = true
