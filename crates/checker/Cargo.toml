[package]
name = "sphere-checker"
description = "Observe-only Sphere L2 checker ExEx"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
# reth
reth-ethereum-primitives = { workspace = true, default-features = true }
reth-exex.workspace = true
reth-chainspec = { workspace = true, default-features = true }
reth-codecs.workspace = true
reth-db.workspace = true
reth-node-api.workspace = true
reth-metrics.workspace = true
reth-primitives-traits = { workspace = true, features = ["std"] }
reth-storage-api.workspace = true
reth-evm.workspace = true
reth-revm.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-contract.workspace = true
alloy-eips.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-provider = { workspace = true, features = ["ws"] }
alloy-rpc-client = { workspace = true, default-features = true }
alloy-rpc-types-eth.workspace = true
alloy-sol-types = { workspace = true, features = ["json"] }
alloy-transport.workspace = true

# spheres
sphere-contracts = { path = "../contracts", features = ["rpc"] }
sphere-primitives = { path = "../primitives", features = ["reth"] }
sphere-precompiles = { path = "../precompiles" }
sphere-l1 = { path = "../l1" }

# misc
eyre.workspace = true
futures.workspace = true
metrics.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, default-features = true, optional = true }
antithesis_sdk = { workspace = true, optional = true }
bincode.workspace = true
bytes.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
alloy-genesis.workspace = true
alloy-consensus = { workspace = true, features = ["std"] }
alloy-rlp.workspace = true
alloy-rpc-types-eth.workspace = true
reth-primitives-traits = { workspace = true, features = ["std", "test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
sphere-evm = { path = "../evm" }
sphere-chainspec = { path = "../chainspec" }
arc-execution-config.workspace = true
serde_json = { workspace = true, default-features = true }
test-case.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
fuzz = ["dep:antithesis_sdk", "antithesis_sdk/full", "dep:serde_json"]
